<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hillside Messenger · Připravit přístupový odkaz</title><style>body{max-width:780px;margin:40px auto;padding:0 20px;font:16px/1.6 system-ui;color:#173c35}input,select,button{font:inherit;padding:10px;margin:5px 0;width:100%;box-sizing:border-box}input[type=checkbox]{width:auto}label{display:block;margin-top:15px}aside{background:#fff1d7;padding:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#175c45}</style><h1>Připravit přístupový odkaz</h1><aside>Pouze příprava odkazu s PINem pro portál. Zprávy se neodesílají, Wallet ani TapHome se nemění. Odeslání musí následně projít kontrolou registru v Messengeru.</aside><label>Kód Alfréda<input id="alf" autocomplete="off"></label><label>Apartmán<select id="apt"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>Ověřený čtyřmístný PIN<input id="door" inputmode="numeric" maxlength="4" autocomplete="off"></label><label><input id="verified" type="checkbox"> Potvrzuji dokončený check-in, úhradu položek hosta a shodu PINu, apartmánu a platnosti přístupu v TapHome s rezervací.</label><button id="build">Připravit odkaz s PINem – nic neposílat</button><p id="status" role="status"></p><pre id="result"></pre><p>Vyžaduje přihlášení v <a href="/">Messengeru</a>. Nový odkaz se uloží na 180 dní. Dřívější odkazy se nemění.</p><script>
const el=id=>document.getElementById(id),signature=()=>JSON.stringify([el('alf').value,el('apt').value,el('door').value,el('verified').checked]);
for(const id of ['alf','apt','door','verified'])el(id).addEventListener('input',()=>{el('result').textContent='';el('status').textContent='Údaje se změnily. Zkontrolujte je a připravte odkaz znovu.';});
el('build').onclick=async()=>{
 el('build').disabled=true;el('result').textContent='';el('status').textContent='Připravuji pouze přístupový odkaz…';
 try{
  const alf=el('alf').value.trim().toUpperCase(),apt=el('apt').value,door=el('door').value.trim(),submitted=signature();
  if(!/^[A-Z0-9]{6}$/.test(alf)||! /^[1-4]$/.test(apt)||! /^\d{4}$/.test(door)||!el('verified').checked)throw Error('Zkontrolujte kód Alfréda, apartmán, čtyřmístný PIN a potvrzení ověření.');
  const urls={};for(const lang of ['cs','en','de']){const u=new URL('https://hillside18-guest-portal.vercel.app/');u.searchParams.set('alf',alf);u.searchParams.set('apt',apt);if(lang!=='cs')u.searchParams.set('lang',lang);u.searchParams.set('done','1');u.searchParams.set('door',door);urls[lang]=u.href;}
  const r=await fetch('/api/guest-link',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls})}),d=await r.json();if(!r.ok)throw Error(d.error||'Odkaz se nepodařilo připravit.');
  if(signature()!==submitted)throw Error('Údaje se mezitím změnily. Připravte odkaz znovu.');
  for(const lang of ['cs','en','de']){const u=new URL(d.urls?.[lang]);if(u.origin!=='https://hs18-generator.vercel.app'||!/^\/s\/[A-Za-z0-9_-]{22}(\/(en|de))?$/.test(u.pathname)||u.search||u.hash)throw Error('Neplatný krátký odkaz.');}
  el('result').textContent=['CZ: '+d.urls.cs,'EN: '+d.urls.en,'DE: '+d.urls.de].join('\n');el('status').textContent='Odkaz s PINem připraven. Odesláno 0 zpráv. Wallet ani TapHome se nezměnily.';
 }catch(e){el('status').textContent=e.message;}finally{el('build').disabled=false;}
};
</script></html>
